# The security findings messaging accepts, read by the build's security checks
# (looper-scan, tacplus-dev/looper README: Security checks). Each entry needs an id,
# a reason, who decided and when it expires; an expired one fails the checks again.
#
# #18: cargo-deny reports every crate tacplus 2.6.1 generates (the chassis and the
# model) as unlicensed, because their Cargo.toml declares no license key. Their owner
# is tacplus: the generator sets the key in tacplus-dev/tacplus#368 (its 2.6 backport,
# tacplus-dev/tacplus#390). This repository drops these entries in the same land that
# moves tacplus.lock to the 2.6 patch carrying #368 (#18 stays open until then).
# Decided by Jody on #18, 2026-11-15; they expire on 2026-12-31.
exceptions:
  - id: cargo-deny:unlicensed:am@0.1.0
    reason: "#18, am@0.1.0 is generated by tacplus 2.6.1 without a license key; owner tacplus: fixed in tacplus-dev/tacplus#368, removed when tacplus.lock moves to the 2.6 patch carrying it"
    where: Cargo.lock
    decided_by: "jodydadescott (hub on #18, 2026-11-15)"
    expires: 2026-12-31
  - id: cargo-deny:unlicensed:approval@1.0.0
    reason: "#18, approval@1.0.0 is generated by tacplus 2.6.1 without a license key; owner tacplus: fixed in tacplus-dev/tacplus#368, removed when tacplus.lock moves to the 2.6 patch carrying it"

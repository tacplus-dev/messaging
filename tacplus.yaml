kind: service
language: rust
# compiler floor: the looper runs the latest 2.4.x compiler image (tacplus#161).
tacplus: "2.4"
# Rust takes only pkg's last segment: the crate stays messaging-model.
pkg: com.github.tacplusdev.messaging
output-dir: target/generated-sources
src: proto
# topics declared here publish through the eventbus broker.
depends:
  # records here declare residency; the record query plane is the query trait
  # hosted by stratum.
  - stratum
  - eventbus
